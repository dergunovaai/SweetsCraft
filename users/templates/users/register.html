
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | SweetsCraft</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .registration {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #70452c;
        }

        h3 {
            text-align: center;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #70452c;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #593720;
        }

        .errorlist {
            color: #c0392b;
            font-size: 14px;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #70452c;
        }
    </style>
</head>

<body>

<div class="registration">

    <h1>SweetsCraft</h1>
    <h3>Создание аккаунта</h3>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Зарегистрироваться
        </button>

        <p class="login-link">
            Уже есть аккаунт?
            <a href="{% url 'login' %}">Войти</a>
        </p>
    </form>

</div>

</body>
</html>
