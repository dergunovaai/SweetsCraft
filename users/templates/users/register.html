
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация | SweetCraft</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="account-shell">
        <section class="account-card">
            <p class="account-brand">SweetCraft</p>
            <h1>Регистрация</h1>
            <p class="account-intro">Создайте аккаунт SweetCraft.</p>
            <form class="account-form" method="post">
                {% csrf_token %}
                {% for field in form %}
                    <p>
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.help_text %}<span class="account-help">{{ field.help_text }}</span>{% endif %}
                        {{ field.errors }}
                    </p>
                {% endfor %}
                <button type="submit">Зарегистрироваться</button>
            </form>
            <p class="account-switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        </section>
    </main>
</body>
</html>
