<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | SweetCraft</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="account-shell">
        <section class="account-card">
            <p class="account-brand">SweetCraft</p>
            <h1>Войти</h1>
            <p class="account-intro">Войдите в аккаунт, чтобы продолжить.</p>
            <form class="account-form" method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}<div class="account-errors">{{ form.non_field_errors }}</div>{% endif %}
                {% for field in form %}
                    <p>
                        {{ field.label_tag }}
                        {{ field }}
                        {{ field.errors }}
                    </p>
                {% endfor %}
                <button type="submit">Войти</button>
            </form>
            <p class="account-switch">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
        </section>
    </main>
</body>
</html>
