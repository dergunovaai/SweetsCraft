{% extends 'base.html' %}

{% block title %}Регистрация — SweetCraft{% endblock %}

{% block content %}
    <section class="auth-page" aria-labelledby="register-heading">
        <div class="auth-card">
            <p class="eyebrow">SweetCraft / Аккаунт</p>
            <h1 id="register-heading">Регистрация</h1>
            <p class="auth-card__intro">Создайте аккаунт, чтобы получать бонусы за заказы.</p>
            <form class="auth-form" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="detail-action auth-form__submit" type="submit">Создать аккаунт <span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-card__footer">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        </div>
    </section>
{% endblock %}
