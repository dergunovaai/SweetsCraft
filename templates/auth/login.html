{% extends 'base.html' %}

{% block title %}Войти — SweetCraft{% endblock %}

{% block content %}
    <section class="auth-page" aria-labelledby="login-heading">
        <div class="auth-card">
            <p class="eyebrow">SweetCraft / Аккаунт</p>
            <h1 id="login-heading">Войти</h1>
            <p class="auth-card__intro">Сохраняйте любимые вкусы и следите за бонусами.</p>
            <form class="auth-form" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="detail-action auth-form__submit" type="submit">Войти <span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-card__footer">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
        </div>
    </section>
{% endblock %}
