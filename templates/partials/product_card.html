{% load static %}
<a class="cake-card{% if product.transparent %} cake-card--transparent{% endif %}{% if not product.image %} cake-card--drink{% endif %}" href="{% url detail_url product.slug %}">
    <div class="cake-card__image-wrap">
        {% if product.image %}
            <img class="cake-card__image" src="{% static product.image %}" alt="{{ product.name }}" loading="lazy">
        {% else %}
            <div class="product-card__placeholder" aria-hidden="true"><span>{{ product.mark }}</span></div>
        {% endif %}
        <span class="cake-card__category">{{ product.category }}</span>
    </div>
    <div class="cake-card__body">
        <div>
            <h3>{{ product.catalog_title }}</h3>
            <p class="cake-card__composition">{{ product.composition }}</p>
        </div>
        <div class="cake-card__footer">
            <p class="cake-card__price"><strong>{{ product.price_piece }}</strong><span>/ {{ product.price_unit|default:'кусок' }}</span></p>
            <span class="cake-card__arrow" aria-hidden="true">→</span>
        </div>
    </div>
</a>
